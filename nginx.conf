server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints bundled assets; cache those indefinitely.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Let React Router handle deep links such as /products/:id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
